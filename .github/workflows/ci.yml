name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22.x', '1.27.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.mod
      - name: Install C23 toolchain
        shell: bash
        run: |
          if ! version=$(gcc -dumpversion 2>/dev/null) || (( ${version%%.*} < 14 )); then
            sudo apt-get update
            sudo apt-get install -y gcc-14
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          fi
          gcc --version
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -o gors ./cmd/gors
      - run: ./gors --version
      - run: ./gors run examples/modules/main.gors --backend c
      - run: ./gors run examples/modules/main.gors --backend go
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.mod
      - uses: msys2/setup-msys2@v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add GCC to PATH
        shell: pwsh
        run: '"C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go test -count=1 -parallel 2 ./...
      - run: go vet ./...
      - run: go build -o gors.exe ./cmd/gors
      - run: .\gors.exe --version
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install C23 toolchain
        shell: bash
        run: |
          if ! version=$(gcc -dumpversion 2>/dev/null) || (( ${version%%.*} < 14 )); then
            sudo apt-get update
            sudo apt-get install -y gcc-14
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          fi
          gcc --version
      - run: go run ./tools/package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gors-archives
          path: dist/*
