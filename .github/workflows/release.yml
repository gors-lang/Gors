name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.0.0-alpha.4
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]'
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install C23 toolchain
        shell: bash
        run: |
          if ! version=$(gcc -dumpversion 2>/dev/null) || (( ${version%%.*} < 14 )); then
            sudo apt-get update
            sudo apt-get install -y gcc-14
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          fi
          gcc --version
      - name: Verify tag and compiler version
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(go run ./cmd/gors --version)" = "GoRs ${RELEASE_TAG#v}"
      - name: Test both backends
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Build Linux and Windows archives
        run: |
          go run ./tools/package -out dist
          cd dist
          sha256sum -c SHA256SUMS
      - name: Test the packaged compiler without Go
        run: bash tools/check-linux-archive.sh dist/gors-*-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gors-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
      - name: Upload archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "GoRs $RELEASE_TAG" --notes-file CHANGELOG.md "${release_flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
